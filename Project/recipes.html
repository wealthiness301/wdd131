<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Recipes - Healthy Recipes Blog</title>
        <meta name="description" content="All recipes — search, filter, and view details." />
        <link rel="stylesheet" href="styles/main.css" />
        <script src="scripts/main.js" defer></script>
    </head>
    <body>
        <header class="header">
            <div class="container">
                <h1>Recipes</h1>
                <nav class="nav" aria-label="Primary">
                    <a href="index.html">Home</a>
                    <a href="recipes.html">Recipes</a>
                    <a href="tips.html">Tips</a>
                    <a href="references.html">References</a>
                </nav>
            </div>
        </header>
        <main class="container">
            <section>
                <h2>Find a Recipe</h2>
                <div class="filters">
                    <input id="search" type="search" placeholder="Search recipes..." aria-label="Search recipes">
                    <select id="tagFilter" aria-label="Filter by tag">
                        <option value="all">All</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="gluten-free">Gluten-free</option>
                        <option value="vegan">Vegan</option>
                        <option value="quick">Quick</option>
                        <option value="pescatarian">Pescatarian</option>
                    </select>
                </div>
                <div id="recipes-list" class="grid" aria-live="polite"></div>
            </section>
            <section id="recipe-detail" aria-labelledby="detail-heading" style="margin-top:1.5rem;">
                <!-- detail injected by JS when a hash or card is clicked -->
            </section>
        </main>
        <footer>
            <div class="container">
                <p>©2025 Wealth Obehioye Osaigbovo • Healthy Recipes Blog • WDD131 • <a
                        href="references.html">References</a></p>
            </div>
        </footer>
    </body>
</html>
