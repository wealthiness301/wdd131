<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="WDD 131 Product Review Form - BYU-Idaho">
        <meta name="author" content="Wealth Obehioye Osaigbovo">
        <title>Product Review Form</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
    </head>

    <body>
        <header>
            <h1>Product Review</h1>
        </header>

        <main>
            <form action="review.html" method="get">
                <!-- Product Name -->
                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Choose a Product ...</option>
                    <!-- JS will populate options -->
                </select>

                <!-- Overall Rating -->
                <fieldset>
                    <legend>Overall Rating</legend>
                    <label><input type="radio" name="rating" value="1" required> ☆</label>
                    <label><input type="radio" name="rating" value="2"> ☆☆</label>
                    <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                    <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                    <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>
                </fieldset>

                <!-- Date of Installation -->
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>

                <!-- Useful Features -->
                <fieldset>
                    <legend>Which features did you find useful in the product?<br><em>(Check all that apply)</em>
                    </legend>
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease-of-use"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </fieldset>

                <!-- Written Review -->
                <label for="reviewText">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="reviewText" name="reviewText" rows="4"></textarea>

                <!-- User Name -->
                <label for="userName">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="userName" name="userName">

                <!-- Submit -->
                <input type="submit" value="Post Review" class="submit-btn">
            </form>
        </main>

        <footer>
            <p>©2025 🌸 Wealth Osaigbovo 🌸 Nigeria<br>
                Last Modification: <span id="lastModified"></span>
            </p>
        </footer>
    </body>

</html>
